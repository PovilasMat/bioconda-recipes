{% set name = "scanpy-scripts" %}
{% set version = "1.9.301" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  - url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: c681d9cf5670d8b771b7327684f19d52f9661ee31e685241af4d960220a5d63b
    folder: scanpy-scripts
    patches:
      - 0001-update-dependency-constraints.patch
      - 0002-preserve-bbknn-default-pcs.patch
      - 0003-preserve-harmony-initialization.patch
      - 0004-preserve-legacy-numerics.patch

build:
  number: 1
  noarch: python
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}
  entry_points:
    - scanpy-cli=scanpy_scripts.cli:cli
    - scanpy-read-10x=scanpy_scripts.cmds:READ_CMD
    - scanpy-filter-cells=scanpy_scripts.cmds:FILTER_CMD
    - scanpy-filter-genes=scanpy_scripts.cmds:FILTER_CMD
    - scanpy-normalise-data=scanpy_scripts.cmds:NORM_CMD
    - scanpy-find-variable-genes=scanpy_scripts.cmds:HVG_CMD
    - scanpy-scale-data=scanpy_scripts.cmds:SCALE_CMD
    - scanpy-regress=scanpy_scripts.cmds:REGRESS_CMD
    - scanpy-run-pca=scanpy_scripts.cmds:PCA_CMD
    - scanpy-neighbors=scanpy_scripts.cmds:NEIGHBOR_CMD
    - scanpy-run-tsne=scanpy_scripts.cmds:TSNE_CMD
    - scanpy-run-umap=scanpy_scripts.cmds:UMAP_CMD
    - scanpy-find-cluster=scanpy_scripts.cli:cluster
    - scanpy-find-markers=scanpy_scripts.cmds:DIFFEXP_CMD
    - scanpy-integrate=scanpy_scripts.cli:integrate
    - scanpy-multiplet=scanpy_scripts.cli:multiplet
  script: "{{ PYTHON }} -m pip install {{ SRC_DIR }}/scanpy-scripts --no-deps --no-build-isolation --ignore-installed -vv"

requirements:
  host:
    - python >=3.11,<3.13
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.11,<3.13
    - scanpy =1.9.3
    # Scanpy 1.9.3 uses anndata.read and np.float_.
    - anndata >=0.9.2,<0.12
    - numpy >=1.23.5,<2
    # Match the original environment's BLAS/LAPACK numerical behavior.
    - libopenblas =0.3.25
    - libblas * *openblas
    - libcblas * *openblas
    - liblapack * *openblas
    # Newer Numba/LLVM changes UMAP's compiled smoothing kernel results.
    - numba =0.60.0
    - pandas <3
    # Louvain still imports pkg_resources, removed in setuptools 82.
    - setuptools <82
    # Scanpy 1.9.3 still imports matplotlib.cm.get_cmap.
    - matplotlib-base <3.9
    - leidenalg
    - loompy
    - louvain
    - igraph
    - Click <8
    # The Harmony compatibility wrapper uses the 0.0.10 cluster_fn hook.
    - harmonypy =0.0.10
    - bbknn =1.6.0
    - cython
    - mnnpy >=0.1.9.5
    # Patched mnnpy needs >=1.9.3; Scanpy 1.9.3 still uses sparse .A.
    - scipy >=1.9.3,<1.14
    - scikit-learn =1.3.2
    # Later UMAP releases require newer scikit-learn APIs.
    - umap-learn >=0.5.3,<0.5.8
    # The local numerical compatibility pipelines follow Scrublet 0.2.3.
    - scrublet =0.2.3
    # Retain legacy layouts; Python 3.12 needs a rebuilt 0.3.5 package.
    - fa2 =0.3.5
  run_constrained:
    # Newer imagecodecs distributions require NumPy 2 in Python metadata.
    - imagecodecs <2026.3.6

test:
  imports:
    - scanpy_scripts
    - scanpy_scripts.lib
    - scanpy_scripts.lib._legacy._pca
    - scanpy_scripts.lib._legacy._tsne
    - scanpy_scripts.lib._legacy._umap
    - scanpy_scripts.lib._legacy._scrublet
    - louvain
  commands:
    - >-
      python -c "import numpy as np; from scipy.sparse import coo_matrix; from scanpy_scripts.lib._legacy._umap import _ColumnOrderedCOO; graph = _ColumnOrderedCOO(([1., 2., 3.], ([0, 1, 0], [1, 0, 1])), shape=(2, 2)); graph.sum_duplicates(); assert np.array_equal(graph.row, [1, 0]) and np.array_equal(graph.col, [0, 1]) and np.array_equal(graph.data, [2., 4.]); assert coo_matrix.sum_duplicates.__module__.startswith('scipy.')"
    - >-
      python -c "import numpy as np; from scanpy_scripts.lib._legacy._svds import svds; x = np.arange(24, dtype=float).reshape(6, 4); u, s, vt = svds(x, k=2, random_state=0); np.testing.assert_allclose((u * s) @ vt, x, atol=1e-12)"
    - >-
      python -c "import numpy as np; from umap.umap_ import smooth_knn_dist; widths, _ = smooth_knn_dist(np.arange(10, dtype=np.float32).reshape(1, -1), 10.0); assert np.isfinite(widths).all(), 'UMAP returned non-finite smoothing widths'"
    - scanpy-cli --help
    - scanpy-read-10x --help
    - scanpy-filter-cells --help
    - scanpy-filter-genes --help
    - scanpy-normalise-data --help
    - scanpy-find-variable-genes --help
    - scanpy-scale-data --help
    - scanpy-regress --help
    - scanpy-run-pca --help
    - scanpy-neighbors --help
    - scanpy-run-tsne --help
    - scanpy-run-umap --help
    - scanpy-find-cluster --help
    - scanpy-find-markers --help
    - scanpy-integrate --help
    - scanpy-multiplet --help

about:
  home: https://github.com/ebi-gene-expression-group/scanpy-scripts
  dev_url: https://github.com/ebi-gene-expression-group/scanpy-scripts
  license: Apache-2.0 AND BSD-3-Clause AND MIT
  license_file:
    - scanpy-scripts/LICENSE
    - scanpy-scripts/LICENSE.sklearn
    - scanpy-scripts/LICENSE.scanpy
    - scanpy-scripts/LICENSE.scipy
    - scanpy-scripts/LICENSE.scrublet
  summary: Scripts for using scanpy from the command line

extra:
  container:
    # click requires a Unicode locale
    extended-base: True
  recipe-maintainers:
    - nh3
    - pinin4fjords
    - pcm32
